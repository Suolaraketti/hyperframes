<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px; height: 1080px; overflow: hidden;
        background: #070b14; font-family: "Oswald", sans-serif; color: #f4f8ff;
      }
      #root { position: absolute; inset: 0; overflow: hidden; }

      .glow { position: absolute; border-radius: 50%; filter: blur(60px); pointer-events: none; }

      /* camera layer */
      #world { position: absolute; inset: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

      #logoSvg { position: absolute; inset: 0; width: 1920px; height: 1080px; }

      /* pillar labels */
      .pillar { position: absolute; left: 1095px; width: 760px; display: flex; align-items: center; gap: 28px; opacity: 0; }
      .pidx { font-family: "JetBrains Mono", monospace; font-size: 34px; font-weight: 500; color: #3fa9ff; font-variant-numeric: tabular-nums; }
      .ptitle { font-size: 52px; font-weight: 700; letter-spacing: -0.02em; color: #f4f8ff; line-height: 1; }
      .psub { font-size: 25px; color: #a9bbd6; margin-top: 9px; }
      #p1 { top: 352px; }
      #p2 { top: 497px; }
      #p3 { top: 642px; }

      /* resolve lockup (fixed, outside the camera) */
      #resolve { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 38px; opacity: 0; }
      #resolve .rlogo { width: 880px; height: auto; }
      #resolve .rtag { font-family: "JetBrains Mono", monospace; font-size: 30px; letter-spacing: 0.3em; color: #7fc3f7; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11" data-width="1920" data-height="1080">

      <div class="glow" id="bgGlow" style="width:1300px;height:1300px;top:50%;left:42%;margin:-650px 0 0 -650px;background:#15518f;opacity:0;"></div>

      <div id="world" data-layout-allow-overflow>
        <svg id="logoSvg" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Dialfyne symbol">
          <defs>
            <linearGradient id="blue" x1="60" y1="54" x2="520" y2="424" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#73D8FF"/><stop offset="48%" stop-color="#23B2FF"/><stop offset="100%" stop-color="#1294FF"/>
            </linearGradient>
          </defs>

          <!-- connectors (screen space) -->
          <g fill="none" stroke="#3fa9ff" stroke-width="5" stroke-linecap="round">
            <path id="c1" d="M852 396 H1058"/>
            <path id="c2" d="M852 542 H1058"/>
            <path id="c3" d="M814 688 H1058"/>
          </g>
          <g fill="#3fa9ff">
            <circle id="n1" cx="1058" cy="396" r="9"/>
            <circle id="n2" cx="1058" cy="542" r="9"/>
            <circle id="n3" cx="1058" cy="688" r="9"/>
          </g>

          <!-- the symbol (native coords, scaled + placed left) -->
          <g transform="translate(140 182) scale(1.5)" stroke="url(#blue)" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path id="m-stub" d="M86 239 H222" stroke-width="66"/>
            <path id="m-brace" d="M308 80 C260 106 253 135 253 177 C253 207 241 229 222 239 C242 252 253 280 253 314 C253 352 273 379 308 398" stroke-width="66"/>
            <path id="m-p1" d="M343 143 H453" stroke-width="50"/>
            <path id="m-p2" d="M343 240 H453" stroke-width="50"/>
            <path id="m-p3" d="M343 337 H427" stroke-width="50"/>
          </g>
        </svg>

        <div class="pillar" id="p1"><div class="pidx">01</div><div><div class="ptitle">AI Voice</div><div class="psub">Answers every call. Books the job.</div></div></div>
        <div class="pillar" id="p2"><div class="pidx">02</div><div><div class="ptitle">AI Roleplay</div><div class="psub">Reps practice before they dial.</div></div></div>
        <div class="pillar" id="p3"><div class="pidx">03</div><div><div class="ptitle">AI Automations</div><div class="psub">The busywork, handled.</div></div></div>
      </div>

      <!-- resolve: full lockup -->
      <div id="resolve">
        <svg class="rlogo" viewBox="0 0 2048 478" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Dialfyne">
          <defs><linearGradient id="rblue" x1="60" y1="54" x2="1518" y2="424" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#73D8FF"/><stop offset="48%" stop-color="#23B2FF"/><stop offset="100%" stop-color="#1294FF"/></linearGradient></defs>
          <g stroke="url(#rblue)" stroke-linecap="round" stroke-linejoin="round">
            <path d="M86 239 H222" stroke-width="66"/>
            <path d="M308 80 C260 106 253 135 253 177 C253 207 241 229 222 239 C242 252 253 280 253 314 C253 352 273 379 308 398" stroke-width="66"/>
            <path d="M343 143 H453" stroke-width="50"/><path d="M343 240 H453" stroke-width="50"/><path d="M343 337 H427" stroke-width="50"/>
            <path d="M1406 186 H1517" stroke-width="37"/><path d="M1406 240 H1517" stroke-width="37"/><path d="M1406 294 H1517" stroke-width="37"/>
          </g>
          <g fill="#FFFFFF">
            <path d="M662 0C1121 0 1416 292 1416 744C1416 1197 1116 1490 656 1490H80V0ZM496 344V1146H630C881 1146 996 1017 996 744C996 473 885 344 642 344Z" transform="translate(535.000 308.000) scale(0.0878906 -0.0878906)"/>
            <path d="M496 1490H80V0H496Z" transform="translate(667.969 308.000) scale(0.0878906 -0.0878906)"/>
            <path d="M0 0H455L528 245H1026L1097 0H1565L1060 1490H500ZM624 565 628 578C682 758 732 932 781 1113C829 932 878 758 930 578L934 565Z" transform="translate(723.594 308.000) scale(0.0878906 -0.0878906)"/>
            <path d="M80 0H1138V352H496V1490H80Z" transform="translate(866.143 308.000) scale(0.0878906 -0.0878906)"/>
            <path d="M80 0H496V536H1159V874H496V1138H1199V1490H80Z" transform="translate(974.678 308.000) scale(0.0878906 -0.0878906)"/>
            <path d="M555 0H957V508L1496 1490H1023L822 1072C800 1025 778 978 758 930C736 978 714 1025 690 1072L476 1490H0L555 508Z" transform="translate(1088.574 308.000) scale(0.0878906 -0.0878906)"/>
            <path d="M80 0H496V544C496 604 496 721 491 855C561 726 627 611 669 544L1008 0H1432V1490H1016V944C1016 873 1017 752 1021 631C963 738 902 849 867 905L504 1490H80Z" transform="translate(1225.059 308.000) scale(0.0878906 -0.0878906)"/>
          </g>
        </svg>
        <div class="rtag">Voice &middot; Roleplay &middot; Automations</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // --- virtual camera: move #world so (px,py) sits at screen center, scaled by Z ---
      function camPose(px, py, Z) { return { x: 960 - px * Z, y: 540 - py * Z, scale: Z }; }
      function camTo(px, py, Z, at, dur, ease) {
        var p = camPose(px, py, Z);
        tl.to("#world", { x: p.x, y: p.y, scale: p.scale, duration: dur, ease: ease || "power2.inOut" }, at);
      }
      // start zoomed in on the stub
      gsap.set("#world", Object.assign({ transformOrigin: "0 0" }, camPose(360, 540, 2.3)));

      // draw-on helper
      function drawIn(sel, at, dur, ease) {
        var el = document.querySelector(sel), len = el.getTotalLength();
        gsap.set(el, { strokeDasharray: len, strokeDashoffset: len });
        tl.to(el, { strokeDashoffset: 0, duration: dur, ease: ease || "power1.inOut" }, at);
      }
      gsap.set(["#n1", "#n2", "#n3"], { scale: 0, transformOrigin: "center" });

      /* --- background (fixed, behind camera) --- */
      tl.to("#bgGlow", { opacity: 0.5, duration: 0.8, ease: "power2.out" }, 0.0);
      tl.to("#bgGlow", { scale: 1.1, duration: 5.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.8);

      /* --- 1. DRAW + CAMERA FOLLOWS THE TRACE --- */
      drawIn("#m-stub", 0.25, 0.5, "power2.out");
      drawIn("#m-brace", 0.6, 0.95, "power1.inOut");
      drawIn("#m-p1", 1.5, 0.4, "power2.out");
      drawIn("#m-p2", 1.65, 0.4, "power2.out");
      drawIn("#m-p3", 1.8, 0.4, "power2.out");
      tl.fromTo("#logoSvg", { filter: "brightness(1)" }, { filter: "brightness(1.3)", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2.2);
      // camera tracks the pen (back-to-back moves, no overlap), then settles on the fan
      camTo(470, 520, 2.2, 0.25, 0.6, "sine.inOut");   // stub into pinch
      camTo(580, 400, 2.05, 0.85, 0.75, "sine.inOut"); // up the brace
      camTo(680, 560, 1.95, 1.6, 0.55, "sine.inOut");  // toward the prongs
      camTo(780, 540, 1.8, 2.15, 0.55, "power2.inOut"); // settle on the prongs

      /* --- 2. ESTABLISH THE FAN, DRAW CONNECTORS --- */
      camTo(850, 540, 1.35, 2.7, 0.85, "power2.inOut");
      drawIn("#c1", 2.8, 0.5, "power2.inOut");
      drawIn("#c2", 3.0, 0.5, "power2.inOut");
      drawIn("#c3", 3.2, 0.5, "power2.inOut");
      tl.to("#n1", { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 3.15);
      tl.to("#n2", { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 3.35);
      tl.to("#n3", { scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 3.55);

      /* --- 3. PILLAR-TO-PILLAR TOUR (camera pushes into each) --- */
      camTo(1360, 400, 1.7, 3.7, 0.9, "power3.inOut");
      tl.fromTo("#p1", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 4.0);
      camTo(1360, 545, 1.7, 5.0, 0.85, "power2.inOut");
      tl.fromTo("#p2", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 5.3);
      camTo(1360, 690, 1.7, 6.3, 0.85, "power2.inOut");
      tl.fromTo("#p3", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 6.6);

      /* --- 4. ZOOM OUT -> FULL WORDMARK --- */
      camTo(960, 540, 1.0, 7.7, 1.1, "power2.inOut"); // pull all the way back
      tl.to("#world", { opacity: 0, duration: 0.6, ease: "power2.in" }, 8.5);
      tl.fromTo("#resolve", { opacity: 0, scale: 0.92, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.9, ease: "expo.out" }, 8.6);
      tl.fromTo("#resolve .rtag", { opacity: 0, letterSpacing: "0.6em" }, { opacity: 1, letterSpacing: "0.3em", duration: 0.7, ease: "power2.out" }, 9.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
